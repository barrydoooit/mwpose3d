[build-system]
requires = ["setuptools>=42", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mwpose3d"
version = "0.0.0"
description = "mmWave radar-based 3D human pose estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name="Your Name", email="your@email.com" }
]
dependencies = [
    # Core ML frameworks
    "torch>=2.0",
    "numpy>=1.24,<2.2",
    
    # OpenMMLab ecosystem
    "mmengine>=0.10.0",
    "mmcv>=2.0.0",
    
    # Sparse convolution (optional, for SECOND backbone)
    # "spconv-cu118>=2.3.0",  # Uncomment and adjust CUDA version as needed
    
    # Visualization
    "pyqtgraph>=0.13.0",
    "PySide6>=6.5.0",
    "pyopengl>=3.1.0",
    "matplotlib>=3.7.0",
    
    # Data processing
    "h5py>=3.9.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "filterpy>=1.4.5",
    
    # Serial communication (for IWR6843)
    "pyserial>=3.5",
    
    # Input handling (for dataset collection)
    "pynput>=1.7.6",
    
    # Utilities
    "tqdm>=4.65.0",
    "debugpy>=1.6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["mwpose3d*", "apps*", "projects*", "tools*"]
exclude = ["tests", "docs", "data", "checkpoints"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.cfg"]