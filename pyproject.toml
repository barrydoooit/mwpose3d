[project]
name = "mwpose3d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Visualization
    "pyqtgraph>=0.13.0",
    "PySide6>=6.5.0",
    "pyopengl>=3.1.0",
    "matplotlib>=3.7.0",
    # Data processing
    "h5py>=3.9.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "filterpy>=1.4.5",
    "pyquaternion>=0.9.9",
    # Serial communication (for IWR6843)
    "pyserial>=3.5",
    # Input handling (for dataset collection)
    "pynput>=1.7.6",
    # Utilities
    "tqdm>=4.65.0",
    "debugpy>=1.6.0",
    "networkx>=3.0",
    "orjson>=3.9.0",
 
]


[project.optional-dependencies]
cpu   = ["torch", "torchvision",]
cu118 = ["torch", "torchvision",]
cu121 = ["torch", "torchvision",]
cu124 = ["torch", "torchvision",]

[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "numpy",
  "torch",  # setup.py imports torch.utils.cpp_extension
]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation = true

conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
    { extra = "cu121" },
    { extra = "cu124" },
  ],
]

[tool.setuptools]
packages = { find = { include = ["mwpose3d*"] } }

[tool.uv.sources]
mwcore = { path = "../mwCore", editable = true }

torch = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true